          - heading [level=4] [ref=e751]:
            - text: RGBA color modes
            - link "Direct link to RGBA color modes" [ref=e752] [cursor=pointer]:
              - /url: "#rgba-color-modes"
              - text: "#"
          - paragraph [ref=e753]: When using the "BGR (packed)", "BGRA (packed)", and "RGBA (separate fields)" color modes, your point cloud message must contain certain fields to display color information for each point.
          - heading [level=5] [ref=e754]:
            - text: RGBA (separate fields)
            - link "Direct link to RGBA (separate fields)" [ref=e755] [cursor=pointer]:
              - /url: "#rgba-separate-fields"
              - text: "#"
          - paragraph [ref=e756]:
            - text: For
            - code [ref=e757]: foxglove.PointCloud
            - text: and
            - code [ref=e758]: foxglove.CompressedPointCloud
            - text: messages, each point can contain color information in four separate fields, named
            - code [ref=e759]: red
            - text: ","
            - code [ref=e760]: green
            - text: ","
            - code [ref=e761]: blue
            - text: ", and"
            - code [ref=e762]: alpha
            - text: ", of any numeric type:"
          - list [ref=e763]:
            - listitem [ref=e764]:
              - strong [ref=e765]: Floating-point values
              - text: — 0–1 range
            - listitem [ref=e766]:
              - strong [ref=e767]: Unsigned integer values
              - text: — Maximum possible range (e.g. 0–255 for a
              - code [ref=e768]: UINT8
              - text: field)
            - listitem [ref=e769]:
              - strong [ref=e770]: Signed integer values
              - text: —
              - code [ref=e771]: "-max"
              - text: to
              - code [ref=e772]: max
              - text: (e.g. −127 to 127 for an
              - code [ref=e773]: INT8
              - text: field; a value of −128 is treated as identical to −127)
          - heading [level=5] [ref=e774]:
            - text: BGR (packed) and BGRA (packed)
            - link "Direct link to BGR (packed) and BGRA (packed)" [ref=e775] [cursor=pointer]:
              - /url: "#bgr-packed-and-bgra-packed"
              - text: "#"
          - paragraph [ref=e776]:
            - text: For
            - code [ref=e777]: sensor_msgs/PointCloud2
            - text: messages, each point can contain color information in a single field named
            - code [ref=e778]: rgb
            - text: or
            - code [ref=e779]: rgba
            - text: ":"
          - list [ref=e780]:
            - listitem [ref=e781]:
              - text: Must use a 4-byte type from
              - link "sensor_msgs/PointField" [ref=e782] [cursor=pointer]:
                - /url: http://docs.ros.org/en/melodic/api/sensor_msgs/html/msg/PointField.html
              - text: (
              - code [ref=e783]: UINT32
              - text: ", value 6, is recommended)"
            - listitem [ref=e784]: Each red, green, blue, and alpha value is represented by one byte in the 0–255 range
            - listitem [ref=e785]:
              - text: Bytes must be packed in
              - code [ref=e786]: "[0xBB, 0xGG, 0xRR, 0xAA]"
              - text: order (i.e.
              - code [ref=e787]: (0xAA << 24) | (0xRR << 16) | (0xGG << 8) | 0xBB
              - text: in little-endian order). This order is compatible with RViz.
          - paragraph [ref=e788]: If using the "BGR" mode, the alpha value must still be present, but is ignored.
          - heading [level=3] [ref=e789]:
            - text: Pose
            - link "Direct link to Pose" [ref=e790] [cursor=pointer]:
              - /url: "#pose"
              - text: "#"
          - paragraph [ref=e791]: Poses in a named coordinate frame.
          - table [ref=e792]:
            - rowgroup [ref=e793]:
              - row [ref=e794]:
                - columnheader "framework" [ref=e795]
                - columnheader "schema" [ref=e796]
            - rowgroup [ref=e797]:
              - row [ref=e798]:
                - cell "ROS 1" [ref=e799]
                - cell [ref=e800]:
                  - link [ref=e801] [cursor=pointer]:
                    - /url: https://docs.ros.org/en/noetic/api/geometry_msgs/html/msg/PoseArray.html
                    - code [ref=e802]: geometry_msgs/PoseArray
              - row [ref=e803]:
                - cell "ROS 2" [ref=e804]
                - cell [ref=e805]:
                  - link [ref=e806] [cursor=pointer]:
                    - /url: https://github.com/ros2/common_interfaces/blob/master/geometry_msgs/msg/PoseArray.msg
                    - code [ref=e807]: geometry_msgs/msg/PoseArray
              - row [ref=e808]:
                - cell "ROS 1" [ref=e809]
                - cell [ref=e810]:
                  - link [ref=e811] [cursor=pointer]:
                    - /url: https://docs.ros.org/en/noetic/api/geometry_msgs/html/msg/PoseStamped.html
                    - code [ref=e812]: geometry_msgs/PoseStamped
              - row [ref=e813]:
                - cell "ROS 2" [ref=e814]
                - cell [ref=e815]:
                  - link [ref=e816] [cursor=pointer]:
                    - /url: https://github.com/ros2/common_interfaces/blob/master/geometry_msgs/msg/PoseStamped.msg
                    - code [ref=e817]: geometry_msgs/msg/PoseStamped
              - row [ref=e818]:
                - cell "Custom" [ref=e819]
                - cell [ref=e820]:
                  - link [ref=e821] [cursor=pointer]:
                    - /url: /docs/sdk/schemas/poses-in-frame
                    - code [ref=e822]: foxglove.PosesInFrame
          - heading [level=3] [ref=e823]:
            - text: Scene entity
            - link "Direct link to Scene entity" [ref=e824] [cursor=pointer]:
              - /url: "#scene-entity"
              - text: "#"
          - paragraph [ref=e825]: A collection of primitive shapes (cubes, spheres, text, meshes, lines, etc) used to display anything from a basic bounding box to a complex 3D decision tree or road network.
          - paragraph [ref=e826]:
            - text: Scene entities must be wrapped in a
            - code [ref=e827]: SceneUpdate
            - text: message.
          - paragraph [ref=e828]:
            - text: Model primitives (
            - code [ref=e829]: foxglove.ModelPrimitive
            - text: ) support both a
            - code [ref=e830]: url
            - text: and
            - code [ref=e831]: data
            - text: field. When both are provided and the URL fails to load (e.g., network error), the 3D panel falls back to the embedded
            - code [ref=e832]: data
            - text: so the model can still be displayed.
          - table [ref=e833]:
            - rowgroup [ref=e834]:
              - row [ref=e835]:
                - columnheader "framework" [ref=e836]
                - columnheader "schema" [ref=e837]
            - rowgroup [ref=e838]:
              - row [ref=e839]:
                - cell "Custom" [ref=e840]
                - cell [ref=e841]:
                  - link [ref=e842] [cursor=pointer]:
                    - /url: /docs/sdk/schemas/scene-entity
                    - code [ref=e843]: foxglove.SceneEntity
              - row [ref=e844]:
                - cell "Custom" [ref=e845]
                - cell [ref=e846]:
                  - link [ref=e847] [cursor=pointer]:
                    - /url: /docs/sdk/schemas/scene-update
                    - code [ref=e848]: foxglove.SceneUpdate
          - heading [level=4] [ref=e849]:
            - text: Settings
            - link "Direct link to Settings" [ref=e850] [cursor=pointer]:
              - /url: "#settings-1"
              - text: "#"
          - table [ref=e851]:
            - rowgroup [ref=e852]:
              - row [ref=e853]:
                - columnheader "field" [ref=e854]
                - columnheader "description" [ref=e855]
            - rowgroup [ref=e856]:
              - row [ref=e857]:
                - cell [ref=e858]:
                  - strong [ref=e859]: Color
                - cell "Render all entities under this topic with this color, overriding colors defined in the entities." [ref=e860]
              - row [ref=e861]:
                - cell [ref=e862]:
                  - strong [ref=e863]: Show outlines
                - cell "Display a wireframe outline around rendered entities." [ref=e864]
              - row [ref=e865]:
                - cell [ref=e866]:
                  - strong [ref=e867]: Selection variable
                - cell "Set a global variable with this name to the selected entity ID." [ref=e868]
              - row [ref=e869]:
                - cell [ref=e870]:
                  - strong [ref=e871]: Vertex normals
                - cell "Toggle calculation of vertex normals. Normals improve lighting and visual appearance but incur a significant performance penalty in some cases." [ref=e872]
          - generic [ref=e873]:
            - generic [ref=e874]: tip
            - paragraph [ref=e879]:
              - text: To control entity visibility, publish them on separate
              - link "topics" [ref=e880] [cursor=pointer]:
                - /url: "#topics"
              - text: (for example,
              - code [ref=e881]: /scene/walls
              - text: ","
              - code [ref=e882]: /scene/floor
              - text: ). You can then toggle each topic independently.
          - heading [level=3] [ref=e883]:
            - text: Transforms
            - link "Direct link to Transforms" [ref=e884] [cursor=pointer]:
              - /url: "#transforms"
              - text: "#"
          - paragraph [ref=e885]: A transform (translation and rotation) between two reference frames in 3D space.
          - table [ref=e886]:
            - rowgroup [ref=e887]:
              - row [ref=e888]:
                - columnheader "framework" [ref=e889]
                - columnheader "schema" [ref=e890]
            - rowgroup [ref=e891]:
              - row [ref=e892]:
                - cell "ROS 1" [ref=e893]
                - cell [ref=e894]:
                  - link [ref=e895] [cursor=pointer]:
                    - /url: https://docs.ros.org/en/noetic/api/tf/html/msg/tfMessage.html
                    - code [ref=e896]: tf/tfMessage
              - row [ref=e897]:
                - cell "ROS 1" [ref=e898]
                - cell [ref=e899]:
                  - link [ref=e900] [cursor=pointer]:
                    - /url: https://docs.ros.org/en/noetic/api/tf2_msgs/html/msg/TFMessage.html
                    - code [ref=e901]: tf2_msgs/TFMessage
              - row [ref=e902]:
                - cell "ROS 2" [ref=e903]
                - cell [ref=e904]:
                  - link [ref=e905] [cursor=pointer]:
                    - /url: https://github.com/ros2/geometry2/blob/ros2/tf2_msgs/msg/TFMessage.msg
                    - code [ref=e906]: tf2_msgs/msg/TFMessage
              - row [ref=e907]:
                - cell "Custom" [ref=e908]
                - cell [ref=e909]:
                  - link [ref=e910] [cursor=pointer]:
                    - /url: /docs/sdk/schemas/frame-transform
                    - code [ref=e911]: foxglove.FrameTransform
          - heading [level=3] [ref=e912]:
            - text: Velodyne scan
            - link "Direct link to Velodyne scan" [ref=e913] [cursor=pointer]:
              - /url: "#velodyne-scan"
              - text: "#"
          - paragraph [ref=e914]: Velodyne lidar scan packets from the Velodyne ROS driver.
          - table [ref=e915]:
            - rowgroup [ref=e916]:
              - row [ref=e917]:
                - columnheader "framework" [ref=e918]
                - columnheader "schema" [ref=e919]
            - rowgroup [ref=e920]:
              - row [ref=e921]:
                - cell "ROS 1" [ref=e922]
                - cell [ref=e923]:
                  - link [ref=e924] [cursor=pointer]:
                    - /url: https://docs.ros.org/en/noetic/api/velodyne_msgs/html/msg/VelodyneScan.html
                    - code [ref=e925]: velodyne_msgs/VelodyneScan
              - row [ref=e926]:
                - cell "ROS 2" [ref=e927]
                - cell [ref=e928]:
                  - link [ref=e929] [cursor=pointer]:
                    - /url: https://github.com/ros-drivers/velodyne/blob/ros2/velodyne_msgs/msg/VelodyneScan.msg
                    - code [ref=e930]: velodyne_msgs/msg/VelodyneScan
          - heading [level=3] [ref=e931]:
            - text: Video
            - link "Direct link to Video" [ref=e932] [cursor=pointer]:
              - /url: "#video"
              - text: "#"
          - paragraph [ref=e933]:
            - text: Compressed videos displayed in the 3D scene, using the corresponding
            - link "Camera field-of-view" [ref=e934] [cursor=pointer]:
              - /url: "#camera-field-of-view"
            - text: messages.
          - table [ref=e935]:
            - rowgroup [ref=e936]:
              - row [ref=e937]:
                - columnheader "framework" [ref=e938]
                - columnheader "schema" [ref=e939]
            - rowgroup [ref=e940]:
              - row [ref=e941]:
                - cell "Custom" [ref=e942]
                - cell [ref=e943]:
                  - link [ref=e944] [cursor=pointer]:
                    - /url: /docs/sdk/schemas/compressed-video
                    - code [ref=e945]: foxglove.CompressedVideo
          - heading [level=3] [ref=e946]:
            - text: Voxel Grid
            - link "Direct link to Voxel Grid" [ref=e947] [cursor=pointer]:
              - /url: "#voxel-grid"
              - text: "#"
          - paragraph [ref=e948]: A 3D volumetric grid used to represent occupancy information in a spatial environment, typically used in robot navigation and obstacle avoidance. Each voxel can be marked (obstacle), present (observed), or unknown, and the grid is used to compute traversability.
          - paragraph [ref=e949]:
            - img "voxelgrid" [ref=e950]
          - table [ref=e951]:
            - rowgroup [ref=e952]:
              - row [ref=e953]:
                - columnheader "framework" [ref=e954]
                - columnheader "schema" [ref=e955]
            - rowgroup [ref=e956]:
              - row [ref=e957]:
                - cell "ROS 1" [ref=e958]
                - cell [ref=e959]:
                  - link "costmap_2d/VoxelGrid" [ref=e960] [cursor=pointer]:
                    - /url: http://docs.ros.org/en/api/costmap_2d/html/msg/VoxelGrid.html
              - row [ref=e961]:
                - cell "ROS 2" [ref=e962]
                - cell [ref=e963]:
                  - link "nav2_msgs/msg/VoxelGrid" [ref=e964] [cursor=pointer]:
                    - /url: https://github.com/ros-navigation/navigation2/blob/main/nav2_msgs/msg/VoxelGrid.msg
              - row [ref=e965]:
                - cell "Custom" [ref=e966]
                - cell [ref=e967]:
                  - link [ref=e968] [cursor=pointer]:
                    - /url: /docs/sdk/schemas/voxel-grid
                    - code [ref=e969]: foxglove.VoxelGrid
          - heading [level=4] [ref=e970]:
            - text: ROS Settings
            - link "Direct link to ROS Settings" [ref=e971] [cursor=pointer]:
              - /url: "#ros-settings"
              - text: "#"
          - table [ref=e972]:
            - rowgroup [ref=e973]:
              - row [ref=e974]:
                - columnheader [ref=e975]:
                  - strong [ref=e976]: field
                - columnheader [ref=e977]:
                  - strong [ref=e978]: description
            - rowgroup [ref=e979]:
              - row [ref=e980]:
                - cell [ref=e981]:
                  - strong [ref=e982]: Color mode
                - cell [ref=e983]:
                  - text: "How to color each voxel. Options: •"
                  - strong [ref=e984]: By type
                  - text: (based on occupancy classification) •
                  - strong [ref=e985]: Gradient
                  - text: (numeric field mapped to a gradient) •
                  - strong [ref=e986]: Rainbow
                  - text: (predefined colormap)
              - row [ref=e987]:
                - cell [ref=e988]:
                  - strong [ref=e989]: Gradient
                - cell "Only shown if \"Color mode\" is set to \"Gradient\". User-defined color mapping for voxel values." [ref=e990]
              - row [ref=e991]:
                - cell [ref=e992]:
                  - strong [ref=e993]: Marked and present
                - cell "Only shown if \"Color mode\" is set to \"By type\". RGBA color for voxels that are both marked and present." [ref=e994]
              - row [ref=e995]:
                - cell [ref=e996]:
                  - strong [ref=e997]: Present
                - cell "Only shown if \"Color mode\" is set to \"By type\". RGBA color for voxels that are present but not marked." [ref=e998]
              - row [ref=e999]:
                - cell [ref=e1000]:
                  - strong [ref=e1001]: Marked
                - cell "Only shown if \"Color mode\" is set to \"By type\". RGBA color for voxels that are marked but not present." [ref=e1002]
              - row [ref=e1003]:
                - cell [ref=e1004]:
                  - strong [ref=e1005]: Use lighting
                - cell "Enables lighting for voxel shading in 3D view." [ref=e1006]
          - heading [level=4] [ref=e1007]:
            - text: ROS Voxel classification
            - link "Direct link to ROS Voxel classification" [ref=e1008] [cursor=pointer]:
              - /url: "#ros-voxel-classification"
              - text: "#"
          - paragraph [ref=e1009]:
            - text: When using
            - strong [ref=e1010]: By type
            - text: "coloring:"
          - list [ref=e1011]:
            - listitem [ref=e1012]:
              - strong [ref=e1013]: Marked
              - text: voxels represent obstacles or areas flagged as non-traversable.
            - listitem [ref=e1014]:
              - strong [ref=e1015]: Present
              - text: voxels represent observed but unmarked areas.
            - listitem [ref=e1016]:
              - strong [ref=e1017]: Marked and present
              - text: voxels are both observed and flagged.
          - paragraph [ref=e1018]:
            - text: Each voxel is rendered as a cube in 3D space and can be shaded based on lighting settings. The resolution and origin of the grid are defined in the message metadata (
            - code [ref=e1019]: resolutions
            - text: ","
            - code [ref=e1020]: origin
            - text: ", and"
            - code [ref=e1021]: data
            - text: fields).
          - heading [level=4] [ref=e1022]:
            - code [ref=e1023]: foxglove.VoxelGrid
            - text: settings
            - link "Direct link to foxglovevoxelgrid-settings" [ref=e1024] [cursor=pointer]:
              - /url: "#foxglovevoxelgrid-settings"
              - text: "#"
          - table [ref=e1025]:
            - rowgroup [ref=e1026]:
              - row [ref=e1027]:
                - columnheader "field" [ref=e1028]
                - columnheader "description" [ref=e1029]
            - rowgroup [ref=e1030]:
              - row [ref=e1031]:
                - cell "Color mode" [ref=e1032]
                - cell [ref=e1033]:
                  - text: "One of: Flat: solid colorColor map: pre-defined color paletteGradient: smooth transition between two custom colorsRGBA (separate fields): use embedded color from each cell's"
                  - code [ref=e1034]: red
                  - text: ","
                  - code [ref=e1035]: green
                  - text: ","
                  - code [ref=e1036]: blue
                  - text: ", and"
                  - code [ref=e1037]: alpha
                  - text: fields (
                  - link "see below" [ref=e1038] [cursor=pointer]:
                    - /url: "#rgba-separate-fields-color-mode"
                  - text: )
              - row [ref=e1039]:
                - cell "Color field" [ref=e1040]
                - cell "Only shown if \"Color mode\" is not set to \"Flat\"; numeric field in message used for coloring logic" [ref=e1041]
              - row [ref=e1042]:
                - cell "Color map" [ref=e1043]
                - cell "Only shown if \"Color mode\" is set to \"Color map\"; \"Turbo\" (Google) or \"Rainbow\" (RViz); for mapping \"Color field\" values to colors" [ref=e1044]
              - row [ref=e1045]:
                - cell "Gradient" [ref=e1046]
                - cell "Only shown if \"Color mode\" is set to \"Gradient\"; The two colors to interpolate between, based on the \"color field\"" [ref=e1047]
              - row [ref=e1048]:
                - cell "Opacity" [ref=e1049]
                - cell "Only shown if \"Color mode\" is set to \"Color map\" or \"BGR (packed)\"; sets alpha value for all cells" [ref=e1050]
              - row [ref=e1051]:
                - cell "Value min" [ref=e1052]
                - cell "Only shown if \"Color mode\" is not set to \"Flat\"; minimum value used to normalize incoming grid's \"Color field\" values" [ref=e1053]
              - row [ref=e1054]:
                - cell "Value max" [ref=e1055]
                - cell "Only shown if \"Color mode\" is not set to \"Flat\"; maximum value used to normalize incoming grid's \"Color field\" values" [ref=e1056]
              - row [ref=e1057]:
                - cell "Lighting" [ref=e1058]
                - cell "Only shown if \"Elevation\" is set; enables shading from simulated directional lighting, based on elevation surface normals" [ref=e1059]
              - row [ref=e1060]:
                - cell "Frame lock" [ref=e1061]
                - cell [ref=e1062]:
                  - text: "\"On\" means the grid is locked to the frame specified by its"
                  - code [ref=e1063]: frame_id
                  - text: ", and will move as that frame's transforms change. \"Off\" means the grid is relative to the fixed frame and will not move after it is first displayed"
              - row [ref=e1064]:
                - cell "Draw behind" [ref=e1065]
                - cell "\"On\" means the grid is rendered before the rest of the scene, so it appears behind other scene elements regardless of their relative depth. \"Off\" means the grid is rendered normally" [ref=e1066]
          - heading [level=5] [ref=e1067]:
            - text: RGBA (separate fields) color mode
            - link "Direct link to RGBA (separate fields) color mode" [ref=e1068] [cursor=pointer]:
              - /url: "#rgba-separate-fields-color-mode-1"
              - text: "#"
          - paragraph [ref=e1069]:
            - text: Each cell can contain color information in four separate fields, named
            - code [ref=e1070]: red
            - text: ","
            - code [ref=e1071]: green
            - text: ","
            - code [ref=e1072]: blue
            - text: ", and"
            - code [ref=e1073]: alpha
            - text: ", of any numeric type:"
          - list [ref=e1074]:
            - listitem [ref=e1075]:
              - strong [ref=e1076]: Floating-point values
              - text: — 0–1 range
            - listitem [ref=e1077]:
              - strong [ref=e1078]: Unsigned integer values
              - text: — Maximum possible range (e.g. 0–255 for a
              - code [ref=e1079]: UINT8
              - text: field)
            - listitem [ref=e1080]:
              - strong [ref=e1081]: Signed integer values
              - text: —
              - code [ref=e1082]: "-max"
              - text: to
              - code [ref=e1083]: max
              - text: (e.g. −127 to 127 for an
              - code [ref=e1084]: INT8
              - text: field; a value of −128 is treated as identical to −127)
          - heading [level=2] [ref=e1085]:
            - text: Settings
            - link "Direct link to Settings" [ref=e1086] [cursor=pointer]:
              - /url: "#settings-2"
              - text: "#"
          - heading [level=3] [ref=e1087]:
            - text: Frame
            - link "Direct link to Frame" [ref=e1088] [cursor=pointer]:
              - /url: "#frame"
              - text: "#"
          - paragraph [ref=e1089]: Select your 3D scene's references frames and target following mode.
          - table [ref=e1090]:
            - rowgroup [ref=e1091]:
              - row [ref=e1092]:
                - columnheader "field" [ref=e1093]
                - columnheader "description" [ref=e1094]
            - rowgroup [ref=e1095]:
              - row [ref=e1096]:
                - cell [ref=e1097]:
                  - strong [ref=e1098]: Fixed frame
                - cell [ref=e1099]:
                  - text: The stationary world reference relative to which all other objects in the scene are located. Elements that accumulate over time (for example, point clouds) are stored and displayed in this frame, and in 2D mode the camera faces this frame's x-y plane. By default the
                  - code [ref=e1100]: <Root frame>
                  - text: option is selected, which uses the TF tree root relative to the selected display frame. Choosing a fixed frame closer to the robot can help reduce floating-point precision issues when transforms span large distances.
              - row [ref=e1101]:
                - cell [ref=e1102]:
                  - strong [ref=e1103]: Display frame
                - cell "The coordinate frame the camera follows. The camera position and orientation are defined relative to the origin of this frame." [ref=e1104]
              - row [ref=e1105]:
                - cell [ref=e1106]:
                  - strong [ref=e1107]: Follow mode
                - cell [ref=e1108]:
                  - paragraph [ref=e1109]: "How the camera moves relative to the display frame during playback:"
                  - list [ref=e1110]:
                    - listitem [ref=e1111]:
                      - strong [ref=e1112]: Pose
                      - text: follows the display frame's position, roll, pitch, and yaw
                    - listitem [ref=e1113]:
                      - strong [ref=e1114]: Heading
                      - text: follows the display frame's position and yaw (heading), while pitch and roll are removed so the horizon stays level (the fixed frame's Z-axis stays pointing up)
                    - listitem [ref=e1115]:
                      - strong [ref=e1116]: Position
                      - text: follows the display frame's position only, with orientation aligned to the fixed frame
                    - listitem [ref=e1117]:
                      - strong [ref=e1118]: "Off"
                      - text: does not update viewport
              - row [ref=e1119]:
                - cell [ref=e1120]:
                  - strong [ref=e1121]: Sync timestamps
                - cell [ref=e1122]:
                  - text: Enables
                  - link "timestamp synchronization" [ref=e1123] [cursor=pointer]:
                    - /url: "#timestamp-synchronization"
                  - text: for selected topics. Hidden when the panel is set to
                  - strong [ref=e1124]: Compare all
                  - text: . See the dedicated section below for details.
              - row [ref=e1125]:
                - cell [ref=e1126]:
                  - strong [ref=e1127]: Location topic
                - cell [ref=e1128]:
                  - text: Defines the geographic origin of
                  - link "3D Maps" [ref=e1129] [cursor=pointer]:
                    - /url: "#3d-map-custom-layer"
                  - text: and
                  - link "map layers" [ref=e1130] [cursor=pointer]:
                    - /url: "#map-custom-layer"
                  - text: using a
                  - link "location fix" [ref=e1131] [cursor=pointer]:
                    - /url: "#location-fix"
                  - text: topic with a valid
                  - code [ref=e1132]: frame_id
                  - text: in the TF tree.
                  - strong [ref=e1133]: Auto
                  - text: selects the first topic with a known frame. (Hidden when there are no location fix topics.)
              - row [ref=e1134]:
                - cell [ref=e1135]:
                  - strong [ref=e1136]: ENU frame
                - cell [ref=e1137]:
                  - text: Defines the East-North-Up orientation of the scene and the alignment of
                  - link "3D Maps" [ref=e1138] [cursor=pointer]:
                    - /url: "#3d-map-custom-layer"
                  - text: and
                  - link "map layers" [ref=e1139] [cursor=pointer]:
                    - /url: "#map-custom-layer"
                  - text: . (Hidden when there are no location fix topics.)
          - heading [level=3] [ref=e1140]:
            - text: Scene
            - link "Direct link to Scene" [ref=e1141] [cursor=pointer]:
              - /url: "#scene"
              - text: "#"
          - paragraph [ref=e1142]: Configure generic rendering properties and viewport properties.
          - table [ref=e1143]:
            - rowgroup [ref=e1144]:
              - row [ref=e1145]:
                - columnheader "field" [ref=e1146]
                - columnheader "description" [ref=e1147]
            - rowgroup [ref=e1148]:
              - row [ref=e1149]:
                - cell [ref=e1150]:
                  - strong [ref=e1151]: Show render stats
                - cell "Display rendering performance statistics in panel" [ref=e1152]
              - row [ref=e1153]:
                - cell [ref=e1154]:
                  - strong [ref=e1155]: Background
                - cell "Background color of the scene" [ref=e1156]
              - row [ref=e1157]:
                - cell [ref=e1158]:
                  - strong [ref=e1159]: Label scale
                - cell "Scale factor to apply to all rendered labels" [ref=e1160]
              - row [ref=e1161]:
                - cell [ref=e1162]:
                  - strong [ref=e1163]:
                    - text: Ignore COLLADA
                    - code [ref=e1164]: <up_axis>
                - cell [ref=e1165]:
                  - text: Match the behavior of RViz by ignoring the
                  - code [ref=e1166]: <up_axis>
                  - text: tag in COLLADA files
              - row [ref=e1167]:
                - cell [ref=e1168]:
                  - strong [ref=e1169]: Mesh "up" axis
                - cell "The direction to use as \"up\" when loading meshes without orientation info (e.g. STL, OBJ)" [ref=e1170]
          - heading [level=3] [ref=e1171]:
            - text: View
            - link "Direct link to View" [ref=e1172] [cursor=pointer]:
              - /url: "#view"
              - text: "#"
          - paragraph [ref=e1173]: Configure the camera settings.
          - table [ref=e1174]:
            - rowgroup [ref=e1175]:
              - row [ref=e1176]:
                - columnheader "field" [ref=e1177]
                - columnheader "description" [ref=e1178]
            - rowgroup [ref=e1179]:
              - row [ref=e1180]:
                - cell [ref=e1181]:
                  - strong [ref=e1182]: Sync camera
                - cell "Sync the camera with other panels that also have this setting enabled" [ref=e1183]
              - row [ref=e1184]:
                - cell [ref=e1185]:
                  - strong [ref=e1186]: Distance
                - cell "Camera distance from the display frame origin" [ref=e1187]
              - row [ref=e1188]:
                - cell [ref=e1189]:
                  - strong [ref=e1190]: 3D view
                - cell "Toggles between 3D and 2D views of the scene. The 2D view looks down the z-axis of the fixed frame and flattens the scene against its x-y plane." [ref=e1191]
              - row [ref=e1192]:
                - cell [ref=e1193]:
                  - strong [ref=e1194]: Target
                - cell "Translational offset from the origin of the display frame" [ref=e1195]
              - row [ref=e1196]:
                - cell [ref=e1197]:
                  - strong [ref=e1198]: Theta
                - cell "Azimuthal angle offset from the origin of the display frame in degrees" [ref=e1199]
              - row [ref=e1200]:
                - cell [ref=e1201]:
                  - strong [ref=e1202]: Phi
                - cell "Polar angle offset from the origin of the display frame in degrees" [ref=e1203]
              - row [ref=e1204]:
                - cell [ref=e1205]:
                  - strong [ref=e1206]: Y-axis FOV
                - cell "Vertical field of view in degrees" [ref=e1207]
              - row [ref=e1208]:
                - cell [ref=e1209]:
                  - strong [ref=e1210]: Near
                - cell "Near clipping plane distance" [ref=e1211]
              - row [ref=e1212]:
                - cell [ref=e1213]:
                  - strong [ref=e1214]: Far
                - cell "Far clipping plane distance" [ref=e1215]
              - row [ref=e1216]:
                - cell [ref=e1217]:
                  - strong [ref=e1218]: Log depth
                - cell [ref=e1219]:
                  - text: Enable
                  - link "logarithmic depth buffer" [ref=e1220] [cursor=pointer]:
                    - /url: https://www.gamedeveloper.com/programming/logarithmic-depth-buffer
                  - text: for more uniform depth precision. May result in rendering artifacts or performance degradation.
          - heading [level=4] [ref=e1221]:
            - text: Interaction of log depth and near/far plane settings
            - link "Direct link to Interaction of log depth and near/far plane settings" [ref=e1222] [cursor=pointer]:
              - /url: "#interaction-of-log-depth-and-nearfar-plane-settings"
              - text: "#"
          - paragraph [ref=e1223]:
            - text: The
            - strong [ref=e1224]: Near
            - text: ","
            - strong [ref=e1225]: Far
            - text: ", and"
            - strong [ref=e1226]: Log depth
            - text: settings are interrelated. When using a very small
            - strong [ref=e1227]: Near
            - text: value or a large
            - strong [ref=e1228]: Far
            - text: value, enabling
            - strong [ref=e1229]: Log depth
            - text: "may reduce visual artifacts. For example, in the video below:"
          - list [ref=e1230]:
            - listitem [ref=e1231]: The left panel does not use logarithmic depth, and it has a near clipping plane of 1.0. The grids render smoothly, but objects close to the viewer are clipped.
            - listitem [ref=e1232]: The middle panel does not use logarithmic depth, and has a near plane of 0.01. The viewer can get closer to objects without clipping, but rendering artifacts (z-fighting) appear between multiple grids.
            - listitem [ref=e1233]: The right panel enables the logarithmic depth setting. This avoids z-fighting by providing more depth precision for the grids, while still allowing a near plane value of 0.01 for reduced clipping.
          - heading [level=3] [ref=e1235]:
            - text: Transforms
            - link "Direct link to Transforms" [ref=e1236] [cursor=pointer]:
              - /url: "#transforms-1"
              - text: "#"
          - paragraph [ref=e1237]: A robotics system produces many messages describing its observations of the world around it. These messages may exist in one or more coordinate frames, or on different parts of the robot.
          - paragraph [ref=e1238]: Transforms define the spacial relationships between two coordinate frames at a given time. To render objects into the scene, there must exist a transform path from the object's coordinate frame to the display frame.
          - paragraph [ref=e1239]:
            - text: Visualize
            - link "transform frames" [ref=e1240] [cursor=pointer]:
              - /url: "#transforms"
            - text: to debug why elements may not be rendering where expected.
          - paragraph:
            - img "transforms"
          - heading [level=4] [ref=e1241]:
            - text: History
            - link "Direct link to History" [ref=e1242] [cursor=pointer]:
              - /url: "#history"
              - text: "#"
          - paragraph [ref=e1243]: The panel stores coordinate frame relationships over time in a transform history store. Each coordinate frame stores up to 10,000 transform messages before it begins to remove the oldest messages as new messages arrive.
          - heading [level=4] [ref=e1244]:
            - text: Preloading
            - link "Direct link to Preloading" [ref=e1245] [cursor=pointer]:
              - /url: "#preloading"
              - text: "#"
          - paragraph [ref=e1246]: Transform preloading in the 3D panel ensures an accurate scene by loading transform messages into memory. Transform preloading may impact 3D panel performance during preloading and seeking. You can disable preloading in the 3D panel settings. However, when disabled, the 3D panel may not properly render your scene in certain circumstances where infrequent coordinate frames are involved. To maintain reasonable memory usage, there is an upper limit on the number of transforms that can be preloaded per topic.
          - heading [level=4] [ref=e1247]:
            - text: Globally-located frames
            - link "Direct link to Globally-located frames" [ref=e1248] [cursor=pointer]:
              - /url: "#globally-located-frames"
              - text: "#"
          - paragraph [ref=e1249]:
            - text: A frame in the scene can be associated with global longitude, latitude, and altitude (LLA) coordinates using the
            - strong [ref=e1250]: Location topic
            - text: field in the
            - link "frame settings" [ref=e1251] [cursor=pointer]:
              - /url: "#frame"
            - text: . This allows you to position the frame relative to a
            - link "3D Map" [ref=e1252] [cursor=pointer]:
              - /url: "#3d-map-custom-layer"
            - text: or
            - link "map layer" [ref=e1253] [cursor=pointer]:
              - /url: "#map-custom-layer"
            - text: .
          - paragraph [ref=e1254]: "Globally-located frames are annotated with a globe, both in the settings and in the scene:"
          - paragraph:
            - img "transforms"
          - heading [level=4] [ref=e1255]:
            - text: Troubleshooting
            - link "Direct link to Troubleshooting" [ref=e1256] [cursor=pointer]:
              - /url: "#troubleshooting"
              - text: "#"
          - paragraph [ref=e1257]:
            - text: When working with live sources where time synchronicity cannot be achieved, it is recommended to have the server publish its time (using the
            - link "SDK" [ref=e1258] [cursor=pointer]:
              - /url: /docs/sdk/websocket-server?lang=cpp#broadcasting-time
            - text: or
            - link "Foxglove Bridge's" [ref=e1259] [cursor=pointer]:
              - /url: https://github.com/foxglove/foxglove-sdk/blob/main/ros/src/foxglove_bridge/README.md#capabilities
            - code [ref=e1260]: time
            - text: capability). Otherwise if the server time is ahead of the visualization app, certain messages in the 3D panel will display immediately but coordinate frame state can lag behind as the app uses its wall time instead of the server time.
          - heading [level=4] [ref=e1261]:
            - text: Settings
            - link "Direct link to Settings" [ref=e1262] [cursor=pointer]:
              - /url: "#settings-3"
              - text: "#"
          - table [ref=e1263]:
            - rowgroup [ref=e1264]:
              - row [ref=e1265]:
                - columnheader "field" [ref=e1266]
                - columnheader "description" [ref=e1267]
            - rowgroup [ref=e1268]:
              - row [ref=e1269]:
                - cell [ref=e1270]:
                  - strong [ref=e1271]: Values relative to
                - cell [ref=e1272]:
                  - text: Controls transform sidebar readouts only. Shows
                  - strong [ref=e1273]: Translation
                  - text: and
                  - strong [ref=e1274]: Rotation
                  - text: relative to the
                  - strong [ref=e1275]: Parent
                  - text: ","
                  - strong [ref=e1276]: Fixed frame
                  - text: ", or"
                  - strong [ref=e1277]: Display frame
                  - text: . This does not change 3D scene artifacts.
              - row [ref=e1278]:
                - cell [ref=e1279]:
                  - strong [ref=e1280]: Editable offsets
                - cell [ref=e1281]:
                  - text: Toggles in-app editing of transform frames. Editable
                  - strong [ref=e1282]: Translation offset
                  - text: and
                  - strong [ref=e1283]: Rotation offset
                  - text: values are always relative to the parent frame, regardless of the
                  - strong [ref=e1284]: Values relative to
                  - text: setting. When "on", you can update those values to tweak transform frames, see the impact on the scene, and debug how you may want to adjust the frames on your robot. When turned "off", it reverts to the original translation and rotation values.
              - row [ref=e1285]:
                - cell [ref=e1286]:
                  - strong [ref=e1287]: Labels
                - cell "Toggle the display of transform labels." [ref=e1288]
              - row [ref=e1289]:
                - cell [ref=e1290]:
                  - strong [ref=e1291]: Axis scale
                - cell "Scale of transform axis (displayed as an arrow marker)" [ref=e1292]
              - row [ref=e1293]:
                - cell [ref=e1294]:
                  - strong [ref=e1295]: Line width
                - cell "Width of transform (displayed as a line marker)" [ref=e1296]
              - row [ref=e1297]:
                - cell [ref=e1298]:
                  - strong [ref=e1299]: Line color
                - cell "Color of transform (displayed as a line marker)" [ref=e1300]
              - row [ref=e1301]:
                - cell [ref=e1302]:
                  - strong [ref=e1303]: Enable preloading
                - cell "Preload transform messages from the data source." [ref=e1304]
          - heading [level=3] [ref=e1305]:
            - text: Topics
            - link "Direct link to Topics" [ref=e1306] [cursor=pointer]:
              - /url: "#topics"
              - text: "#"
          - paragraph [ref=e1307]:
            - text: Lists topics containing
            - link "supported messages" [ref=e1308] [cursor=pointer]:
              - /url: "#supported-messages"
            - text: that can be displayed in the scene. Toggle individual topics.
          - paragraph [ref=e1309]: Each topic provides settings to configure how the visualization appears in the scene.
          - paragraph [ref=e1310]:
            - text: Any topic with messages matching the
            - link "supported messages" [ref=e1311] [cursor=pointer]:
              - /url: "#supported-messages"
            - text: will show up in the topics list. Each supported format has format specific visualization settings. These settings will show up under the topic.
          - paragraph [ref=e1312]: Use the top-level menu to toggle all topics, or click the eye icon next to a topic name to toggle it individually.
          - heading [level=3] [ref=e1313]:
            - text: Grid custom layer
            - link "Direct link to Grid custom layer" [ref=e1314] [cursor=pointer]:
              - /url: "#grid-custom-layer"
              - text: "#"
          - paragraph [ref=e1315]: A grid is 2D square with a fixed size and number of divisions. You can create any number of grids. Grids can be rendered relative to the fixed frame, the display frame or any other transform frame.
          - paragraph:
            - img "grid"
          - paragraph [ref=e1316]: Use the grid layer settings to change the frame, size, color, divisions, and other properties of the grid.
          - heading [level=3] [ref=e1317]:
            - text: URDF custom layer
            - link "Direct link to URDF custom layer" [ref=e1318] [cursor=pointer]:
              - /url: "#urdf-custom-layer"
              - text: "#"
          - paragraph [ref=e1319]:
            - link "URDF" [ref=e1320] [cursor=pointer]:
              - /url: https://wiki.ros.org/urdf
            - text: robot models are loaded automatically if your data source supports parameters (i.e. a native ROS 1 or ROS 2 connection) and the
            - code [ref=e1321]: /robot_description
            - text: parameter is set to valid URDF XML.
          - paragraph [ref=e1322]: You can add URDF models with a custom layer. Use each layer's menu to duplicate or delete the custom layer.
          - table [ref=e1323]:
            - rowgroup [ref=e1324]:
              - row [ref=e1325]:
                - columnheader "field" [ref=e1326]
                - columnheader "description" [ref=e1327]
            - rowgroup [ref=e1328]:
              - row [ref=e1329]:
                - cell [ref=e1330]:
                  - strong [ref=e1331]: Source
                - cell [ref=e1332]:
                  - text: Source of the URDF
                  - list [ref=e1333]:
                    - listitem [ref=e1334]:
                      - strong [ref=e1335]: URL
                      - text: "– URL to the source URDF file in one of the following schemes:"
                      - list [ref=e1336]:
                        - listitem [ref=e1337]:
                          - code [ref=e1338]: http(s)://
                          - text: – Over an HTTP(S) connection
                        - listitem [ref=e1339]:
                          - code [ref=e1340]: package://
                          - text: – Package path. Supported when using the desktop app or a live connection that supports asset fetching, such as
                          - link [ref=e1341] [cursor=pointer]:
                            - /url: /docs/fleet/bridge
                            - code [ref=e1342]: foxglove_bridge
                          - text: .
                        - listitem [ref=e1343]:
                          - code [ref=e1344]: file://
                          - text: – File path. Supported when using the desktop app or a live connection that supports asset fetching.
                    - listitem [ref=e1345]:
                      - strong [ref=e1346]: File path
                      - text: – Absolute file path to the source URDF file. Only supported when using the desktop app.
                    - listitem [ref=e1347]:
                      - strong [ref=e1348]: Parameter
                      - text: – Parameter containing the source URDF file.
                    - listitem [ref=e1349]:
                      - strong [ref=e1350]: Topic
                      - text: – Topic containing the source URDF file.
              - row [ref=e1351]:
                - cell [ref=e1352]:
                  - strong [ref=e1353]: Control mode
                - cell [ref=e1354]:
                  - text: Control mode of the URDF
                  - list [ref=e1355]:
                    - listitem [ref=e1356]:
                      - strong [ref=e1357]: Transforms
                      - text: – URDF is controlled using transform data
                    - listitem [ref=e1358]:
                      - strong [ref=e1359]: Joint states
                      - text: – URDF is controlled by a joint states topic
              - row [ref=e1360]:
                - cell [ref=e1361]:
                  - strong [ref=e1362]: Label
                - cell "(Optional) Label with which the custom layer will appear in the sidebar." [ref=e1363]
              - row [ref=e1364]:
                - cell [ref=e1365]:
                  - strong [ref=e1366]: Frame prefix
                - cell "(Optional) Prefix for robot's transforms. Also commonly known as a TF prefix." [ref=e1367]
              - row [ref=e1368]:
                - cell [ref=e1369]:
                  - strong [ref=e1370]: Display mode
                - cell [ref=e1371]:
                  - text: Robot link geometries to display
                  - list [ref=e1372]:
                    - listitem [ref=e1373]:
                      - strong [ref=e1374]: Auto
                      - text: – Defaults to visual geometries, but falls back to collision geometries if there are no visuals
                    - listitem [ref=e1375]:
                      - strong [ref=e1376]: Visual
                      - text: – Visual geometries
                    - listitem [ref=e1377]:
                      - strong [ref=e1378]: Collision
                      - text: – Collision geometries
              - row [ref=e1379]:
                - cell [ref=e1380]:
                  - strong [ref=e1381]: Color
                - cell "Fallback color for the URDF model, if the source doesn't contain colors." [ref=e1382]
              - row [ref=e1383]:
                - cell [ref=e1384]:
                  - strong [ref=e1385]: Opacity
                - cell "Opacity of link geometries on a scale from 0 (fully transparent) to 1 (fully opaque)." [ref=e1386]
              - row [ref=e1387]:
                - cell [ref=e1388]:
                  - strong [ref=e1389]: Show outlines
                - cell "Visualize edges of URDF link geometries." [ref=e1390]
              - row [ref=e1391]:
                - cell [ref=e1392]:
                  - strong [ref=e1393]: Show axis
                - cell "Visualize coordinate frame axis for each URDF link." [ref=e1394]
              - row [ref=e1395]:
                - cell [ref=e1396]:
                  - strong [ref=e1397]: Axis scale
                - cell "Scale of link coordinate frame axis." [ref=e1398]
              - row [ref=e1399]:
                - cell [ref=e1400]:
                  - strong [ref=e1401]: Joint states
                - cell [ref=e1402]:
                  - text: Select the topic providing joint state data, enabled when
                  - strong [ref=e1403]: Control mode
                  - text: is
                  - strong [ref=e1404]: Joint states
                  - text: . Each joint states message must list every joint in the URDF — Foxglove does not merge partial updates across messages.
              - row [ref=e1405]:
                - cell [ref=e1406]:
                  - strong [ref=e1407]: Links
                - cell "Toggle visiblity of each URDF link or set a custom offset with respect to the parent link. The latter is disabled when the transform to the parent link is provided by the datasource." [ref=e1408]
          - heading [level=4] [ref=e1409]:
            - text: Resolution of URDF assets
            - link "Direct link to Resolution of URDF assets" [ref=e1410] [cursor=pointer]:
              - /url: "#resolution-of-urdf-assets"
              - text: "#"
          - paragraph [ref=e1411]:
            - text: Foxglove can fetch URDFs, meshes, and other assets referenced by
            - code [ref=e1412]: package://
            - text: and
            - code [ref=e1413]: file://
            - text: "URLs in several ways:"
          - list [ref=e1414]:
            - listitem [ref=e1415]:
              - text: When using the desktop app,
              - code [ref=e1416]: file://
              - text: URLs load from the local filesystem. Package paths can be resolved by finding packages in directories specified by the
              - link "ROS_PACKAGE_PATH" [ref=e1417] [cursor=pointer]:
                - /url: /docs/settings#desktop-app
              - text: setting.
            - listitem [ref=e1418]:
              - text: When using a live connection that supports asset fetching, such as
              - link "Foxglove Bridge" [ref=e1419] [cursor=pointer]:
                - /url: /docs/fleet/bridge
              - text: ","
              - code [ref=e1420]: package://
              - text: and
              - code [ref=e1421]: file://
              - text: URLs can be fetched over the WebSocket connection.
            - listitem [ref=e1422]:
              - text: When the URDF is given as an HTTP(S) URL or local file path, package paths can be resolved when the URL or file path contains the package name. Consider the following example where the package name
              - code [ref=e1423]: leo_description
              - text: "is contained in the URDF URL:"
              - list [ref=e1424]:
                - listitem [ref=e1425]:
                  - text: "URDF URL:"
                  - code [ref=e1426]: https://raw.githubusercontent.com/LeoRover/leo_common-ros2/humble/leo_description/urdf/leo.urdf.xacro
                - listitem [ref=e1427]:
                  - text: "Asset URL:"
                  - code [ref=e1428]: package://leo_description/models/Rocker.dae
                - listitem [ref=e1429]:
                  - text: "Resolved asset URL:"
                  - code [ref=e1430]: https://raw.githubusercontent.com/LeoRover/leo_common-ros2/humble/leo_description/models/Rocker.dae
          - paragraph [ref=e1431]:
            - text: In the desktop app, Foxglove loads
            - code [ref=e1432]: file://
            - text: URLs from the local filesystem first and uses the connection as a fallback. For
            - code [ref=e1433]: package://
            - text: URLs, Foxglove tries the connection first.
          - heading [level=3] [ref=e1434]:
            - text: 3D map custom layer
            - link "Direct link to 3D map custom layer" [ref=e1435] [cursor=pointer]:
              - /url: "#3d-map-custom-layer"
              - text: "#"
          - generic [ref=e1436]:
            - paragraph [ref=e1437]:
              - link "Pro" [ref=e1438] [cursor=pointer]:
                - /url: https://foxglove.dev/pricing
            - paragraph [ref=e1442]:
              - link "Enterprise" [ref=e1443] [cursor=pointer]:
                - /url: https://foxglove.dev/pricing
            - paragraph [ref=e1447]:
              - link "Academic" [ref=e1448] [cursor=pointer]:
                - /url: https://foxglove.dev/pricing
          - paragraph [ref=e1452]:
            - text: Add photorealistic 3D map geometry to a 3D or Image panel by selecting
            - strong [ref=e1453]: Add 3D Map
            - text: from the custom layer menu.
          - paragraph [ref=e1454]: Foxglove currently sources this geometry from Google Photorealistic 3D Tiles. The provider may change in future releases. Loading the geometry requires internet access.
          - generic [ref=e1455]:
            - generic [ref=e1456]: note
            - paragraph [ref=e1461]:
              - text: 3D Maps availability is based on your organization's plan, not your seat type. A basic seat can view 3D Maps in an existing shared layout.
              - link "A developer seat is required to add or configure one" [ref=e1462] [cursor=pointer]:
                - /url: /docs/visualization/layouts
              - text: ", because doing so edits the layout."
          - paragraph [ref=e1463]:
            - text: 3D Maps use a
            - link "location fix" [ref=e1464] [cursor=pointer]:
              - /url: "#location-fix"
            - text: "to align geographic map geometry with your coordinate frames. To position a 3D Map:"
          - list [ref=e1465]:
            - listitem [ref=e1466]:
              - text: Publish a supported location fix message containing latitude, longitude, altitude, and a
              - code [ref=e1467]: frame_id
              - text: that exists in the transform tree.
            - listitem [ref=e1468]:
              - text: Select the topic under
              - strong [ref=e1469]: Frame
              - text: ">"
              - strong [ref=e1470]: Location topic
              - text: in the 3D panel or
              - strong [ref=e1471]: Location
              - text: ">"
              - strong [ref=e1472]: Location topic
              - text: in the Image panel.
              - strong [ref=e1473]: Auto
              - text: uses the first available valid topic.
            - listitem [ref=e1474]:
              - text: Select the
              - strong [ref=e1475]: ENU frame
              - text: whose XY plane defines the scene's East-North-Up orientation. The location fix's
              - code [ref=e1476]: frame_id
              - text: determines where the global coordinate is attached in the transform tree.
          - paragraph [ref=e1477]:
            - text: Foxglove interprets the location fix altitude as meters above the WGS 84 ellipsoid and uses it to vertically align the 3D Map. Because location fix schemas use
            - code [ref=e1478]: "0"
            - text: as the default for an unset altitude, the panel warns when altitude is missing or zero, even though zero is a valid WGS 84 ellipsoid height.
            - strong [ref=e1479]: Altitude offset
            - text: can be used for a known vertical adjustment instead of modifying the source message.
          - table [ref=e1480]:
            - rowgroup [ref=e1481]:
              - row [ref=e1482]:
                - columnheader "field" [ref=e1483]
                - columnheader "description" [ref=e1484]
            - rowgroup [ref=e1485]:
              - row [ref=e1486]:
                - cell [ref=e1487]:
                  - strong [ref=e1488]: Pixels per facet
                - cell "Screen-space error target used to refine map tiles. Lower values load more detailed geometry and may use more network and rendering resources." [ref=e1489]
              - row [ref=e1490]:
                - cell [ref=e1491]:
                  - strong [ref=e1492]: Altitude offset
                - cell "Additional vertical offset, in meters, applied to the 3D Map." [ref=e1493]
              - row [ref=e1494]:
                - cell [ref=e1495]:
                  - strong [ref=e1496]: Altitude mode
                - cell [ref=e1497]:
                  - strong [ref=e1498]: Location’s Altitude
                  - text: uses the location fix altitude in meters above the WGS 84 ellipsoid, a smooth reference surface near sea level.
                  - strong [ref=e1499]: Auto
                  - text: uses that altitude when valid and nonzero, then falls back to sampled map elevation.
                  - strong [ref=e1500]: Map Sampling
                  - text: uses sampled map elevation.
                  - strong [ref=e1501]: Fixed Reference
                  - text: uses the editable
                  - strong [ref=e1502]: Altitude Reference
                  - text: .
              - row [ref=e1503]:
                - cell [ref=e1504]:
                  - strong [ref=e1505]: Altitude Reference
                - cell [ref=e1506]:
                  - text: Reference elevation in meters above the WGS 84 ellipsoid. In
                  - strong [ref=e1507]: Fixed Reference
                  - text: mode, enter an altitude or sample it from the 3D Map at the location fix.
          - heading [level=3] [ref=e1508]:
            - text: Map custom layer
            - link "Direct link to Map custom layer" [ref=e1509] [cursor=pointer]:
              - /url: "#map-custom-layer"
              - text: "#"
          - paragraph [ref=e1510]: You can add maps with street or satellite imagery to the 3D panel.
          - paragraph [ref=e1511]:
            - text: Use the 3D panel's
            - link "Frame settings" [ref=e1512] [cursor=pointer]:
              - /url: "#frame"
            - text: "to configure how your map layers are positioned and oriented:"
          - list [ref=e1513]:
            - listitem [ref=e1514]:
              - text: The center of maps is determined by the
              - strong [ref=e1515]: Location topic
              - text: setting
            - listitem [ref=e1516]:
              - text: The orientation of maps are determined by the
              - strong [ref=e1517]: ENU frame
              - text: setting
          - paragraph [ref=e1518]: "Each map is a fixed 500m square positioned relative to the XY-plane of the ENU frame:"
          - paragraph:
            - img "tiled map"
          - table [ref=e1519]:
            - rowgroup [ref=e1520]:
              - row [ref=e1521]:
                - columnheader "field" [ref=e1522]
                - columnheader "description" [ref=e1523]
            - rowgroup [ref=e1524]:
              - row [ref=e1525]:
                - cell [ref=e1526]:
                  - strong [ref=e1527]: Type
                - cell [ref=e1528]:
                  - list [ref=e1529]:
                    - listitem [ref=e1530]:
                      - strong [ref=e1531]: Street
                      - text: (© OpenStreetMap contributors)
                    - listitem [ref=e1532]:
                      - strong [ref=e1533]: Satellite
                      - text: (©
                      - link "Esri" [ref=e1534] [cursor=pointer]:
                        - /url: https://www.esri.com/
                      - text: — Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community)
                    - listitem [ref=e1535]:
                      - strong [ref=e1536]: Shaded relief
                      - text: – GEBCO grayscale bathymetry basemap (© GEBCO / NCEI)
                    - listitem [ref=e1537]:
                      - strong [ref=e1538]: Sea marks
                      - text: – OpenSeaMap sea mark chart overlay (© OpenSeaMap contributors). Stack over a base map layer such as Street, Satellite, or Shaded relief.
                    - listitem [ref=e1539]:
                      - strong [ref=e1540]: Isobaths
                      - text: – OpenSeaMap transparent depth contour overlay (© OpenSeaMap contributors). Stack over a base map layer such as Street, Satellite, or Shaded relief.
                    - listitem [ref=e1541]:
                      - strong [ref=e1542]: Custom
                      - text: – Load from a custom URL (Academic, Pro, and Enterprise plans only). Provide a URL to your custom map tiles following the
                      - link "Tile Map Service specs" [ref=e1543] [cursor=pointer]:
                        - /url: https://wiki.osgeo.org/wiki/Tile_Map_Service_Specification
                      - text: ", e.g."
