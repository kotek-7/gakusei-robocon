          - heading [level=2] [ref=e1729]:
            - text: Performance troubleshooting
            - link "Direct link to Performance troubleshooting" [ref=e1730] [cursor=pointer]:
              - /url: "#performance-troubleshooting"
              - text: "#"
          - paragraph [ref=e1731]: Here are some tips for dealing with performance issues you may encounter.
          - heading [level=3] [ref=e1732]:
            - text: Hardware acceleration
            - link "Direct link to Hardware acceleration" [ref=e1733] [cursor=pointer]:
              - /url: "#hardware-acceleration"
              - text: "#"
          - paragraph [ref=e1734]: If you are experiencing poor performance while interacting with the 3D panel, it may be because hardware acceleration is not enabled. Hardware acceleration will significantly improve performance by rendering on the GPU rather than the CPU.
          - paragraph [ref=e1735]:
            - text: If you're using Google Chrome, you can check that hardware graphics acceleration is enabled by going to
            - code [ref=e1736]: chrome://gpu
            - text: and seeing that "WebGL" and/or "WebGL2" are "Hardware accelerated". If not, go to
            - code [ref=e1737]: chrome://settings
            - text: ", search your settings for"
            - code [ref=e1738]: acceleration
            - text: and ensure that the "Use graphics acceleration when available" toggle is enabled. If after these steps you still see that WebGL is still not "Hardware accelerated" in
            - code [ref=e1739]: chrome://gpu
            - text: then you might have to investigate platform-specific steps for enabling your GPU.
          - paragraph [ref=e1740]:
            - text: The desktop app uses Electron (based on Chromium), and should automatically use hardware acceleration when available. If you're seeing issues here, we recommend following the steps above to see if the same issue exists in Chrome. If so, there's a good chance it's affecting our application for the same reasons. Therefore we recommend getting things working in Chrome first, and if the desktop app is still having issues afterward please
            - link "let us know" [ref=e1741] [cursor=pointer]:
              - /url: https://foxglove.dev/chat
            - text: and we'll look into it.
          - paragraph [ref=e1742]: "Some reasons hardware acceleration might be disabled:"
          - list [ref=e1743]:
            - listitem [ref=e1744]: Your graphics drivers are out of date or not installed such that Chrome can make use of them.
            - listitem [ref=e1745]:
              - text: Your system configuration could be unsupported for hardware acceleration in Chrome. A way to solve this is to enable "Override software rendering list" in
              - code [ref=e1746]: about://flags
              - text: ", which can allow Chrome to use hardware acceleration on unsupported systems. This can result in an unstable Chrome experience and is not advised unless necessary."
          - heading [level=3] [ref=e1747]:
            - text: Video acceleration
            - link "Direct link to Video acceleration" [ref=e1748] [cursor=pointer]:
              - /url: "#video-acceleration"
              - text: "#"
          - paragraph [ref=e1749]:
            - text: If you are experiencing poor performance with the 3D panel while using
            - code [ref=e1750]: foxglove.CompressedVideo
            - text: topics, check that video acceleration is enabled.
            - link "Docs here" [ref=e1751] [cursor=pointer]:
              - /url: /docs/visualization/panels/image#checking-video-acceleration
            - text: .
          - heading [level=3] [ref=e1752]:
            - text: Triangle primitives
            - link "Direct link to Triangle primitives" [ref=e1753] [cursor=pointer]:
              - /url: "#triangle-primitives"
              - text: "#"
          - paragraph [ref=e1754]:
            - text: If you have large
            - code [ref=e1755]: foxglove.TriangleListPrimitive
            - text: entities in your scene updates that are added and removed often causing noticable lag, consider toggling the
            - link "\"Vertex normals\" setting" [ref=e1756] [cursor=pointer]:
              - /url: /docs/visualization/panels/3d#scene-entity
            - text: .
          - heading [level=3] [ref=e1757]:
            - text: SceneEntity structure
            - link "Direct link to SceneEntity structure" [ref=e1758] [cursor=pointer]:
              - /url: "#sceneentity-structure"
              - text: "#"
          - paragraph [ref=e1759]: For maximum efficiency, prefer fewer SceneEntities each with many primitives, rather than many SceneEntities each with fewer primitives.
          - paragraph [ref=e1760]:
            - text: When a
            - code [ref=e1761]: SceneEntity
            - text: includes
            - code [ref=e1762]: metadata
            - text: ", the 3D panel shows those key/value pairs when hovering over the entity."
          - heading [level=3] [ref=e1763]:
            - text: Floating point precision
            - link "Direct link to Floating point precision" [ref=e1764] [cursor=pointer]:
              - /url: "#floating-point-precision"
              - text: "#"
          - paragraph [ref=e1765]: To reduce displayed precision issues the 3D panel converts the transform tree coordinates to camera relative equivalents before sending them to the GPU. This allows transforms to have large displacements between them; these displacements can exceed the seven significant digits that 32-bit floating point numbers usually provide. However, this does not prevent precision issues when a scene entity is large itself and has vertices far away from the transform's origin. It is recommended that if a scene entity will be far from its transform origin, then a new intermediate transform should be created near the scene entity, to keep the large displacements inside the transform tree and prevent perceived distortion.
          - heading [level=2] [ref=e1766]:
            - text: Timestamp synchronization
            - link "Direct link to Timestamp synchronization" [ref=e1767] [cursor=pointer]:
              - /url: "#timestamp-synchronization"
              - text: "#"
          - paragraph [ref=e1768]:
            - text: The
            - strong [ref=e1769]: Sync timestamps
            - text: setting gates rendering on exact timestamp alignment across selected topics. When enabled, the panel buffers incoming messages and only renders a frame when every participating topic has a message with the same timestamp.
          - paragraph [ref=e1770]:
            - text: Timestamp synchronization is not available when the 3D panel is set to
            - strong [ref=e1771]: Compare all
            - text: . Switch the Data source picker to a single source to use Sync timestamps.
          - heading [level=3] [ref=e1772]:
            - text: How it works
            - link "Direct link to How it works" [ref=e1773] [cursor=pointer]:
              - /url: "#how-it-works"
              - text: "#"
          - list [ref=e1774]:
            - listitem [ref=e1775]:
              - text: Enable
              - strong [ref=e1776]: Sync timestamps
              - text: in the General settings section.
            - listitem [ref=e1777]:
              - text: For each topic you want to synchronize, enable the
              - strong [ref=e1778]: Sync
              - text: toggle in that topic's settings. At least
              - strong [ref=e1779]: two
              - text: topics must have Sync enabled — otherwise there is nothing to match against.
            - listitem [ref=e1780]: The panel collects messages from all Sync-enabled topics and looks for a complete set where every topic has a message at the same timestamp.
            - listitem [ref=e1781]: When a match is found, those messages are rendered together. Topics without Sync enabled continue rendering independently.
          - paragraph [ref=e1782]:
            - text: The panel retains up to
            - strong [ref=e1783]: 250 unique timestamps
            - text: in its synchronization buffer. If a match is not found within that window, the oldest timestamps are discarded. For best results, ensure your topics publish at the same rate and with aligned timestamps.
          - heading [level=3] [ref=e1784]:
            - text: Timestamp extraction
            - link "Direct link to Timestamp extraction" [ref=e1785] [cursor=pointer]:
              - /url: "#timestamp-extraction"
              - text: "#"
          - paragraph [ref=e1786]:
            - text: Timestamps are extracted from
            - code [ref=e1787]: header.stamp
            - text: for ROS messages or the
            - code [ref=e1788]: timestamp
            - text: field for Foxglove messages — not
            - link "log time" [ref=e1789] [cursor=pointer]:
              - /url: /docs/visualization/playback#message-ordering
            - text: . For scene updates and marker arrays, the timestamp of the first entity or marker in the message is used.
          - heading [level=3] [ref=e1790]:
            - text: What is never synchronized
            - link "Direct link to What is never synchronized" [ref=e1791] [cursor=pointer]:
              - /url: "#what-is-never-synchronized"
              - text: "#"
          - paragraph [ref=e1792]: Transforms and URDFs are never registered for synchronization. Transforms continue to build the transform tree normally, and all entities compute their position at the synced timestamp.
          - heading [level=2] [ref=e1793]:
            - text: Links and resources
            - link "Direct link to Links and resources" [ref=e1794] [cursor=pointer]:
              - /url: "#links-and-resources"
