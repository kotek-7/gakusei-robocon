            - text: (macOS) while placing an endpoint to snap it to measurable objects in the scene — like cube faces, point cloud points, and line segments — when the cursor is near one. This is useful for measuring distances between known features in the scene.
          - generic [ref=e1644]:
            - generic [ref=e1645]: note
