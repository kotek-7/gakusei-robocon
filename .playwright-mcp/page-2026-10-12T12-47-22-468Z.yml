              - row [ref=e710]:
                - cell "Color mode" [ref=e711]
                - cell [ref=e712]:
                  - text: "One of: Flat: solid colorColor map: pre-defined color paletteGradient: smooth transition between two custom colorsBGR (packed):"
                  - code [ref=e713]: sensor_msgs/PointCloud2
                  - text: only; use embedded color from each point's
                  - code [ref=e714]: rgb
                  - text: field (
                  - link "see below" [ref=e715] [cursor=pointer]:
                    - /url: "#rgba-color-modes"
                  - text: ")BGRA (packed):"
                  - code [ref=e716]: sensor_msgs/PointCloud2
                  - text: only; use embedded color from each point's
                  - code [ref=e717]: rgba
                  - text: field (
                  - link "see below" [ref=e718] [cursor=pointer]:
                    - /url: "#rgba-color-modes"
                  - text: ")RGBA (separate fields):"
                  - code [ref=e719]: foxglove.PointCloud
                  - text: and
                  - code [ref=e720]: foxglove.CompressedPointCloud
                  - text: only; use embedded color from each point's
                  - code [ref=e721]: red
                  - text: ","
                  - code [ref=e722]: green
                  - text: ","
                  - code [ref=e723]: blue
                  - text: ", and"
                  - code [ref=e724]: alpha
                  - text: fields (
                  - link "see below" [ref=e725] [cursor=pointer]:
                    - /url: "#rgba-color-modes"
                  - text: )
              - row [ref=e726]:
                - cell "Flat color" [ref=e727]
                - cell "Only shown if \"Color mode\" is set to \"Flat\"; hex code for color of each point" [ref=e728]
              - row [ref=e729]:
                - cell "Color field" [ref=e730]
