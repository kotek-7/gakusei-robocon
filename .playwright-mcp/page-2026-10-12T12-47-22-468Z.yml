          - heading [level=4] [ref=e327]:
            - text: Render modes
            - link "Direct link to Render modes" [ref=e328] [cursor=pointer]:
              - /url: "#render-modes"
              - text: "#"
          - paragraph [ref=e329]: Image topics in the 3D panel support three render modes. Each mode has context-specific settings.
          - list [ref=e330]:
            - listitem [ref=e331]:
              - link [ref=e332] [cursor=pointer]:
                - /url: "#default"
                - strong [ref=e333]: Default
              - text: – Projects the image onto a distorted plane at a fixed distance from the camera.
            - listitem [ref=e334]:
              - link [ref=e335] [cursor=pointer]:
                - /url: "#plane-projection"
                - strong [ref=e336]: Plane projection
              - text: – Projects the image onto the XY plane of a selected coordinate frame.
            - listitem [ref=e337]:
              - link [ref=e338] [cursor=pointer]:
                - /url: "#depth-map"
                - strong [ref=e339]: Depth map
              - text: – Renders depth images as point clouds.
          - heading [level=4] [ref=e340]:
            - text: Default
            - link "Direct link to Default" [ref=e341] [cursor=pointer]:
              - /url: "#default"
              - text: "#"
          - paragraph [ref=e342]: "The default render mode displays images using standard camera projection. This mode shows the following settings:"
          - table [ref=e343]:
            - rowgroup [ref=e344]:
              - row [ref=e345]:
                - columnheader "field" [ref=e346]
                - columnheader "description" [ref=e347]
            - rowgroup [ref=e348]:
              - row [ref=e349]:
                - cell "Render mode" [ref=e350]
                - cell [ref=e351]:
                  - text: "Select how the image is rendered:"
                  - strong [ref=e352]: Default
                  - text: ","
                  - strong [ref=e353]: Plane projection
                  - text: ", or"
                  - strong [ref=e354]: Depth map
                  - text: .
              - row [ref=e355]:
                - cell "Distance" [ref=e356]
                - cell "Distance from the camera at which the image is projected" [ref=e357]
              - row [ref=e358]:
                - cell "Planar projection factor" [ref=e359]
                - cell "Controls the planar projection effect, from zero to one. Zero results in a curved plane with all points equidistant to camera origin. One results in a flat plane orthogonal to the camera's z (depth) axis." [ref=e360]
          - heading [level=4] [ref=e361]:
            - text: Depth map
            - link "Direct link to Depth map" [ref=e362] [cursor=pointer]:
              - /url: "#depth-map"
              - text: "#"
          - paragraph [ref=e363]: The 3D panel can render uncompressed depth images as point clouds, enabling visualization of depth camera data directly in 3D space.
          - paragraph [ref=e364]: "To render a depth image as a point cloud, you need:"
          - list [ref=e365]:
            - listitem [ref=e366]:
              - text: An uncompressed depth image topic with a supported encoding (
              - code [ref=e367]: 32FC1
              - text: ","
              - code [ref=e368]: 16UC1
              - text: ","
              - code [ref=e369]: MONO16
              - text: ","
              - code [ref=e370]: 8UC1
              - text: ","
              - code [ref=e371]: MONO8
              - text: ", or"
              - code [ref=e372]: 8UC3
              - text: ), or a compressed depth image topic using
              - code [ref=e373]: compressedDepth
              - text: 16-bit grayscale PNG
            - listitem [ref=e374]:
              - text: A corresponding
              - link "Camera field-of-view" [ref=e375] [cursor=pointer]:
                - /url: "#camera-field-of-view"
              - text: message with camera calibration data
          - paragraph [ref=e376]:
            - text: Enable the depth image topic in the panel's topic settings, then set the
            - strong [ref=e377]: Render mode
            - text: to
            - strong [ref=e378]: Depth map
            - text: .
          - paragraph [ref=e379]:
            - text: Compressed depth images must be 16-bit grayscale PNG payloads (for example, ROS
            - code [ref=e380]: compressedDepth
            - text: transport using
            - code [ref=e381]: sensor_msgs/CompressedImage
            - text: with a
            - code [ref=e382]: compressedDepth
            - text: format string). Depth values are interpreted as millimeters (see
            - strong [ref=e383]: Distance type
            - text: below for how values are projected into 3D). Other compressed formats (JPEG, color PNG, or 8-bit PNG) are not supported and will show an error.
          - table [ref=e384]:
            - rowgroup [ref=e385]:
              - row [ref=e386]:
                - columnheader "field" [ref=e387]
                - columnheader "description" [ref=e388]
            - rowgroup [ref=e389]:
              - row [ref=e390]:
                - cell "Render mode" [ref=e391]
                - cell [ref=e392]:
                  - text: "Select how the image is rendered:"
                  - strong [ref=e393]: Default
                  - text: ","
                  - strong [ref=e394]: Plane projection
                  - text: ", or"
                  - strong [ref=e395]: Depth map
                  - text: . Only one mode can be active at a time. Settings shown below are only visible when "Render mode" is set to "Depth map".
              - row [ref=e396]:
                - cell "Distance type" [ref=e397]
                - cell [ref=e398]:
                  - text: "How to interpret pixel values:"
                  - strong [ref=e399]: Z-axis
                  - text: (default) interprets each pixel as the distance along the camera's optical axis, while
                  - strong [ref=e400]: Euclidean
                  - text: interprets each pixel as the straight-line distance from the sensor origin. Use
                  - strong [ref=e401]: Euclidean
                  - text: for sensors that report range (e.g., time-of-flight cameras).
              - row [ref=e402]:
                - cell "Point size" [ref=e403]
                - cell "Size of each rendered point in pixels" [ref=e404]
              - row [ref=e405]:
                - cell "Depth scale" [ref=e406]
                - cell [ref=e407]:
                  - text: Scale factor to convert depth values to meters. Defaults to 1.0 for 32-bit float images (
                  - code [ref=e408]: 32FC1
                  - text: ) and 0.001 for all other encodings (
                  - code [ref=e409]: 16UC1
                  - text: ","
                  - code [ref=e410]: MONO16
                  - text: ","
                  - code [ref=e411]: 8UC1
                  - text: ","
                  - code [ref=e412]: MONO8
                  - text: ","
                  - code [ref=e413]: 8UC3
                  - text: ). Customize this to match your camera system's depth scale configuration.
              - row [ref=e414]:
                - cell "RGB topic" [ref=e415]
                - cell "Sibling RGB image topic to colorize the depth point cloud. When set, each point in the cloud is colored using the corresponding pixel from the RGB image. The RGB image can have a different resolution than the depth image, and Foxglove uses bilinear interpolation to sample colors accurately. Select \"None\" to use distance-based coloring instead." [ref=e416]
              - row [ref=e417]:
                - cell "Color mode" [ref=e418]
                - cell [ref=e419]:
                  - text: Only shown when
                  - strong [ref=e420]: RGB topic
                  - text: "is set to \"None\". One of:Color map: color points by depth using a pre-defined color paletteGradient: color points by depth using a smooth transition between two custom colorsFlat: render every point with the same custom color"
              - row [ref=e421]:
                - cell "Flat color" [ref=e422]
                - cell [ref=e423]:
                  - text: Only shown if
                  - strong [ref=e424]: Color mode
                  - text: is set to
                  - strong [ref=e425]: Flat
                  - text: . Sets the point color and alpha.
              - row [ref=e426]:
                - cell "Color map" [ref=e427]
                - cell [ref=e428]:
                  - text: Only shown if
                  - strong [ref=e429]: Color mode
                  - text: is set to
                  - strong [ref=e430]: Color map
                  - text: . Maps depth values to "Turbo" (Google) or "Rainbow" (RViz).
              - row [ref=e431]:
                - cell "Gradient" [ref=e432]
                - cell [ref=e433]:
                  - text: Only shown if
                  - strong [ref=e434]: Color mode
                  - text: is set to
                  - strong [ref=e435]: Gradient
                  - text: . Sets the start and end colors for depth-based coloring.
              - row [ref=e436]:
                - cell "Opacity" [ref=e437]
                - cell [ref=e438]:
                  - text: Only shown if
                  - strong [ref=e439]: Color mode
                  - text: is set to
                  - strong [ref=e440]: Color map
                  - text: . Sets alpha for all points.
              - row [ref=e441]:
                - cell "Value min" [ref=e442]
                - cell [ref=e443]:
                  - text: Only shown if
                  - strong [ref=e444]: Color mode
                  - text: is
                  - strong [ref=e445]: Color map
                  - text: or
                  - strong [ref=e446]: Gradient
                  - text: . Minimum depth value used to normalize point colors.
              - row [ref=e447]:
                - cell "Value max" [ref=e448]
                - cell [ref=e449]:
                  - text: Only shown if
                  - strong [ref=e450]: Color mode
                  - text: is
                  - strong [ref=e451]: Color map
                  - text: or
                  - strong [ref=e452]: Gradient
                  - text: . Maximum depth value used to normalize point colors.
          - paragraph [ref=e453]: For accurate depth-to-RGB colorization, the depth and RGB images should use the same camera frame, or have matching intrinsics with only a rigid transform between frames. The current implementation does not perform stereo rectification, so you may see subtle colorization errors when the sensors are offset and have different intrinsics.
          - heading [level=4] [ref=e454]:
            - text: Plane projection
            - link "Direct link to Plane projection" [ref=e455] [cursor=pointer]:
              - /url: "#plane-projection"
              - text: "#"
          - paragraph [ref=e456]: The 3D panel can project camera images onto a reference plane in the 3D scene. This is especially useful for ground-plane projection, where the elements on the ground-plane in the image can be lined up with objects in the 3D scene. However, things that are protruding or not on the plane will appear distorted.
          - paragraph [ref=e457]:
            - text: To use plane projection, enable the camera image topic in the panel's topic settings, then set the
            - strong [ref=e458]: Render mode
            - text: to
            - strong [ref=e459]: Plane projection
            - text: and select a
            - strong [ref=e460]: Projection frame
            - text: from the available transform frames.
          - table [ref=e461]:
            - rowgroup [ref=e462]:
              - row [ref=e463]:
                - columnheader "field" [ref=e464]
                - columnheader "description" [ref=e465]
            - rowgroup [ref=e466]:
              - row [ref=e467]:
                - cell "Render mode" [ref=e468]
                - cell [ref=e469]:
                  - text: "Select how the image is rendered:"
                  - strong [ref=e470]: Default
                  - text: ","
                  - strong [ref=e471]: Plane projection
                  - text: ", or"
                  - strong [ref=e472]: Depth map
                  - text: . Only one mode can be active at a time. Settings shown below are only visible when "Render mode" is set to "Plane projection".
              - row [ref=e473]:
                - cell "Projection frame" [ref=e474]
                - cell "The coordinate frame to project into. The image will be projected onto this frame's XY plane. There must be a valid transform between this frame and the camera's frame." [ref=e475]
              - row [ref=e476]:
                - cell "Projection distance" [ref=e477]
                - cell "Optional maximum distance from the camera, in meters, at which the image is projected onto the plane. Leave empty to use the default angle-based limit. Increase this value to see more of the image farther from the camera. Minimum 1 meter." [ref=e478]
