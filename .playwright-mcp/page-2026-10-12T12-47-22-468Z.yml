            - rowgroup [ref=e694]:
              - row [ref=e695]:
                - cell "Point shape" [ref=e696]
                - 'cell "Shape of each rendered point: \"Circle\", \"Square\", or \"Cube\". Default: \"Circle\"." [ref=e697]'
              - row [ref=e698]:
