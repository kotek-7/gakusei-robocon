          - paragraph [ref=e59]:
            - text: Visualizing objects in the 3D scene correctly requires your data to conform to certain conventions. When you enable a topic for visualization, the 3D panel will subscribe to the topic, receive messages on the topic in
            - strong [ref=e60]: log time
            - text: "order (see:"
            - link "playback" [ref=e61] [cursor=pointer]:
              - /url: /docs/visualization/playback#message-ordering
            - text: ), and visualize the latest message on each enabled topic using the
            - code [ref=e62]: timestamp
            - text: or
            - code [ref=e63]: header.stamp
            - text: (ROS) information in the message.
          - paragraph [ref=e64]:
            - text: To render objects into the scene, there must exist a transform path from the object's coordinate frame to the display frame
            - emphasis [ref=e65]: at or before the timestamp of the object being visualized
            - text: . For objects this timestamp comes from the
            - code [ref=e66]: timestamp
            - text: or
            - code [ref=e67]: header.stamp
            - text: (ROS) field within the message, NOT the log time (aka receive time). Like other messages, transform messages are received in log time order but stored and accessed by the
            - code [ref=e68]: timestamp
            - text: or
            - code [ref=e69]: header.stamp
            - text: field within the message.
          - paragraph [ref=e70]: This convention allows your robot to receive sensor data and transform state, perceive and identify objects in the scene, and produce a message describing the scene at some time that relates to the sensor data or processing rather than the log time which might come later. This provides a mechanism for more accurately representing the scene as the robot may have experienced it.
