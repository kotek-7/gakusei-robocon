                      - text: or
                      - code [ref=e1545]: "https://t{subdomain}.custom.url/tiles/a{quadkey}.jpeg"
                      - text: .
              - row [ref=e1546]:
                - cell [ref=e1547]:
                  - strong [ref=e1548]: Opacity
                - cell "Opacity of the map" [ref=e1549]
              - row [ref=e1550]:
                - cell [ref=e1551]:
                  - strong [ref=e1552]: Z-position
                - cell "The z-position of the map layer in meters relative to the ENU frame's XY-plane. When creating layouts through the layout API, set a non-zero z-position for Sea marks and Isobaths overlays so they render above the base map." [ref=e1553]
              - row [ref=e1554]:
                - cell [ref=e1555]:
                  - strong [ref=e1556]: Draw behind
                - cell [ref=e1557]:
                  - strong [ref=e1558]: "On"
                  - text: means the map is rendered before the rest of the scene, so it appears behind other scene elements regardless of their relative depth.
                  - strong [ref=e1559]: "Off"
                  - text: means the map is rendered normally
