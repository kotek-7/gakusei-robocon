          - paragraph [ref=e1623]:
            - text: Click the icons next to the topic to open its settings in the sidebar or to display its messages in a new
            - link "Raw Messages panel" [ref=e1624] [cursor=pointer]:
              - /url: /docs/visualization/panels/raw-messages
            - text: .
          - paragraph [ref=e1625]:
            - text: Selecting an object will set a
            - code [ref=e1626]: $selected_id
            - text: variable to the clicked object's
            - code [ref=e1627]: id
            - text: value, if it has one. For
            - link "ROS markers" [ref=e1628] [cursor=pointer]:
              - /url: "#ros-markers"
            - text: and
            - link "scene entities" [ref=e1629] [cursor=pointer]:
              - /url: "#scene-entity"
