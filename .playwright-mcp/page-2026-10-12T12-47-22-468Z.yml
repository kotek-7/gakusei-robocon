              - row [ref=e745]:
                - cell "Value max" [ref=e746]
                - cell "Only shown if \"Color mode\" is not set to \"Flat\"; maximum value used to normalize incoming points' \"Color field\" values" [ref=e747]
              - row [ref=e748]:
