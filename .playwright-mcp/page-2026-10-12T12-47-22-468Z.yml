          - heading [level=4] [ref=e582]:
            - text: Mesh markers
            - link "Direct link to Mesh markers" [ref=e583] [cursor=pointer]:
              - /url: "#mesh-markers"
              - text: "#"
          - paragraph [ref=e584]:
            - text: Markers with a
            - code [ref=e585]: mesh_resource
            - text: "field support the following URL schemes:"
          - list [ref=e586]:
            - listitem [ref=e587]:
              - code [ref=e588]: http(s)://
            - listitem [ref=e589]:
              - code [ref=e590]: package://
              - text: (Desktop app or a live connection that supports asset fetching)
            - listitem [ref=e591]:
              - code [ref=e592]: file://
              - text: (Desktop app or a live connection that supports asset fetching)
          - paragraph [ref=e593]: "And file formats:"
          - list [ref=e594]:
            - listitem [ref=e595]: glTF
            - listitem [ref=e596]: STL
            - listitem [ref=e597]: COLLADA
            - listitem [ref=e598]: Wavefront OBJ
          - paragraph [ref=e599]:
            - strong [ref=e600]:
              - text: glTF (
              - code [ref=e601]: .glb
              - text: )
          - paragraph [ref=e602]: This is the preferred format, as it enjoys the best performance of all supported file types.
          - paragraph [ref=e603]: Binary glTF files bundle all required assets into a single file, with support for embedded meshes, compression, and the same physically-based material system used in Foxglove. As a result, your model should appear in Foxglove similarly to how it appears in other 3D programs.
          - paragraph [ref=e604]:
            - strong [ref=e605]:
              - text: STL (
              - code [ref=e606]: .stl
              - text: )
          - paragraph [ref=e607]: STL files are well supported in Foxglove, but lack some of glTF's visualization features. The main advantage to STL is the ability to share the same files between your hardware manufacturing process and robot visualization tooling.
          - paragraph [ref=e608]: STL was designed for 3D printing and CAD applications, and does not include materials or hierarchies of meshes. While they can be represented in a binary encoding, STL files are commonly represented with ASCII characters, which leads to larger files.
          - paragraph [ref=e609]:
            - strong [ref=e610]:
              - text: COLLADA (
              - code [ref=e611]: .dae
              - text: )
          - paragraph [ref=e612]: As a predecessor to glTF, COLLADA has a similar feature set. With that said, it does have larger XML-based files, no compression, and additional processing overhead.
          - paragraph [ref=e613]:
            - text: There is a
            - link "bug in RViz" [ref=e614] [cursor=pointer]:
              - /url: https://github.com/ros-visualization/rviz/issues/1045
            - text: where the up-axis metadata is ignored, resulting in incorrect orientations for many
            - code [ref=e615]: .dae
            - text: files in ROS environments. To work around this, the 3D panel has a
            - code [ref=e616]: Ignore COLLADA <up_axis>
            - text: setting to toggle between observing the
            - code [ref=e617]: <up-axis>
            - text: tag or ignoring it like RViz.
          - paragraph [ref=e618]:
            - strong [ref=e619]:
              - text: Wavefront OBJ (
              - code [ref=e620]: .obj
              - text: )
          - paragraph [ref=e621]: OBJ is a simple ASCII format predating all other supported formats. It has large file sizes, no material support, no mesh hierarchies, no compression, and additional processing overhead.
          - paragraph [ref=e622]:
            - text: Material support was added to the OBJ format as separate
            - code [ref=e623]: .mtl
            - text: files, which Foxglove does not read.
          - heading [level=3] [ref=e624]:
            - text: Path
            - link "Direct link to Path" [ref=e625] [cursor=pointer]:
              - /url: "#path"
              - text: "#"
          - paragraph [ref=e626]: An array of timestamped poses in a named coordinate frame, denoting an object's path through space.
