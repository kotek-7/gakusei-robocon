          - heading [level=4] [ref=e263]:
            - text: Incremental occupancy grid updates
            - link "Direct link to Incremental occupancy grid updates" [ref=e264] [cursor=pointer]:
              - /url: "#incremental-occupancy-grid-updates"
              - text: "#"
          - paragraph [ref=e265]:
            - text: The 3D panel supports
            - code [ref=e266]: map_msgs/OccupancyGridUpdate
            - text: messages for incremental costmap updates. ROS's
            - code [ref=e267]: costmap_2d
            - text: "node publishes two topics per costmap:"
          - list [ref=e268]:
            - listitem [ref=e269]:
              - text: A
              - strong [ref=e270]: full grid
              - text: (
              - code [ref=e271]: nav_msgs/OccupancyGrid
              - text: ) at a low rate (typically 1–2 Hz)
            - listitem [ref=e272]:
              - strong [ref=e273]: Partial updates
              - text: (
              - code [ref=e274]: map_msgs/OccupancyGridUpdate
              - text: ) at a higher rate (typically 3–12 Hz)
          - paragraph [ref=e275]:
            - text: The panel automatically pairs update topics to their base grid using the
            - code [ref=e276]: _updates
            - text: suffix convention (e.g.
            - code [ref=e277]: /costmap
            - text: and
            - code [ref=e278]: /costmap_updates
            - text: ). Update topics do not appear as separate entries in the settings sidebar — they are consumed internally.
          - generic [ref=e279]:
            - generic [ref=e280]: Performance
            - paragraph [ref=e285]:
              - text: Each update triggers a full texture rebuild of the entire grid. The cost scales linearly at approximately
              - strong [ref=e286]: 13 ns per cell
              - text: . Grids up to ~1.28 million cells (~1130×1130) fit within a single frame at 60 fps. Larger grids (e.g. 2000×2000 global costmaps) may cause frame drops during updates.
          - heading [level=3] [ref=e287]:
            - text: Image
